         horizontale oblige à arbitrer la largeur dès la cinquième entrée. -->

      <span class="entete__marque">Spark</span>
      <!-- Le serveur courant est un CONTEXTE de toutes les destinations, pas

      <nav class="laterale__nav" aria-label="Navigation principale">
        <a href="#/sparks" class="destination">Sparks</a>
        <a href="#/forge" class="destination">Forge</a>

             ci-dessus choisit ce qu'on REGARDE (docs/DAT.md §22.4.7 bis). -->
        <a href="#/serveurs" class="destination">Serveurs</a>
        <a href="#/manuel" class="destination">Manuel</a>
      </nav>
