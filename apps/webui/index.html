<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Console Spark</title>
  <!-- §10.3 : le favicon est référencé explicitement et ne dépend d'aucune police distante. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2323468C'/><path d='M18 5 9 18h6l-2 9 10-14h-6z' fill='%23fff'/></svg>" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/app.css" />
  <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
</head>
<body>
  <div id="racine" class="page">
    <!-- Degré 1 : barre latérale (DESIGN_SYSTEM.md §5.4). Une liste verticale
         absorbe une destination de plus sans rien sacrifier ; une barre
         horizontale oblige à arbitrer la largeur dès la cinquième entrée. -->
    <div class="laterale">
      <span class="entete__marque">Spark</span>
      <!-- Le serveur courant est un CONTEXTE de toutes les destinations, pas
           une destination : il est au-dessus du premier degré
           (DESIGN_SYSTEM_APP.md §1). -->
      <div class="entete__contexte"></div>
      <!-- SPK-40 · docs/DAT.md §36.10.9 : ce qu'un geste n'a pas pu signer se
           dit ICI, et non dans l'écran du geste. La cause est l'état du poste —
           agent vidé, clé non configurée — : elle survit au geste et frappera le
           suivant. Un avertissement posé dans l'écran disparaîtrait en changeant
           de page alors que la cause reste. -->
      <div class="entete__signature"></div>
      <div class="entete__console"></div>
      <nav class="laterale__nav" aria-label="Navigation principale">
        <a href="#/sparks" class="destination">Sparks</a>
        <a href="#/forge" class="destination">Forge</a>
        <!-- SPK-41 : cette destination gère ce qui est DÉCLARÉ ; le sélecteur
             ci-dessus choisit ce qu'on REGARDE (docs/DAT.md §22.4.7 bis). -->
        <a href="#/serveurs" class="destination">Serveurs</a>
        <a href="#/manuel" class="destination">Manuel</a>
      </nav>
    </div>
    <!-- SPK-70 : un registre local des shells vivants, sans aucun octet de
         session. À l'étroit son contenu devient un tiroir, pas une colonne qui
         écraserait la grille du terminal. -->
    <aside class="registre-sessions" aria-labelledby="titre-registre-sessions">
      <div class="registre-sessions__entete">
        <h2 id="titre-registre-sessions">Sessions ouvertes</h2>
        <button type="button" class="bouton bouton--compact registre-sessions__bascule"
                data-registre="basculer" aria-expanded="false"
                aria-controls="contenu-registre-sessions">Afficher</button>
      </div>
      <div id="contenu-registre-sessions" class="registre-sessions__contenu"></div>
    </aside>
    <main class="principal"></main>
  </div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
